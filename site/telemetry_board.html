<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai's Telemetry Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e; /* Dark background for a 'dashboard' feel */
            color: #e0e0e0;
            padding: 20px;
            text-align: center;
        }
        #board-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #0d0d1e; /* Darker inner container */
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            text-align: left;
        }
        h1 {
            color: #00ffff; /* Cyan title */
            text-align: center;
            margin-bottom: 30px;
        }
        #telemetry-log {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #00ffff80;
            padding: 15px;
            border-radius: 8px;
            background-color: #0a0a17;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px dashed #333;
            margin-bottom: 5px;
            font-family: monospace;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .timestamp {
            color: #888;
            margin-right: 10px;
        }
        .action-tag {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            margin-right: 10px;
            font-size: 0.9em;
        }
        .ACTION_SUCCESS { background-color: #2ecc71; color: white; } /* Green */
        .ACTION_FAILURE { background-color: #e74c3c; color: white; } /* Red */
        .ACTION_INFO { background-color: #3498db; color: white; } /* Blue */
    </style>
</head>
<body>
    <div id="board-container">
        <h1>AI Agent Telemetry Board (Mai)</h1>
        <div id="telemetry-log">
            <!-- Log entries will appear here -->
            <div class="log-entry"><span class="timestamp">[SYSTEM]</span> <span class="action-tag ACTION_INFO">SYSTEM</span> Bot operational and awaiting tasks.</div>
        </div>
        <p style="margin-top: 20px; font-size: 0.8em;">Note: Updates are only logged manually via external script injection, not automatically across turns.</p>
    </div>

    <script>
        const logContainer = document.getElementById('telemetry-log');

        /**
         * Records an action taken by the AI agent.
         * In a live environment, this function would be called by a backend API after
         * every successfully executed action (e.g., terminal, write_file).
         * @param {string} action - Type of action (e.g., 'terminal', 'write_file', 'search_files').
         * @param {string} status - 'SUCCESS' or 'FAILURE'.
         * @param {string} details - Detailed description of the action (e.g., "File updated successfully", "Git push failed").
         */
        function recordAction(action, status, details) {
            const timestamp = new Date().toLocaleString();
            const tagClass = status === 'SUCCESS' ? 'ACTION_SUCCESS' : (status === 'FAILURE' ? 'ACTION_FAILURE' : 'ACTION_INFO');
            const tagText = status.toUpperCase();

            // Create the new log entry element
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="timestamp">[${timestamp}]</span>
                <span class="action-tag ${tagClass}">${tagText} (${action})</span>
                ${details}
            `;

            // Add the new entry to the top 
            logContainer.prepend(entry);

            // Keep the log tidy (max 50 entries)
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // --- DEMO INJECTION ---
        // To simulate an action, manually call recordAction in your shell script or
        // inject this command if you were using a continuous process.
        // Example: recordAction('terminal', 'SUCCESS', 'Project files listed successfully.');
        // Example: recordAction('write_file', 'FAILURE', 'Attempted to overwrite file but write was blocked.');
    </script>
</body>
</html>
